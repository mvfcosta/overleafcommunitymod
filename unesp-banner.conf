# Sub_filter não funciona com respostas gzip — força o upstream a enviar sem compressão
proxy_set_header Accept-Encoding "";

sub_filter_once on;
sub_filter_types text/html;

sub_filter '</head>' '
<style>
  .unesp-banner {
    background-color: #0095d9;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .unesp-banner img { height: 44px; }
</style>
</head>';

sub_filter '<body>' '<body>
<div class="unesp-banner">
  <img src="/img/unesp-logo.png" alt="UNESP">
</div>';
