server {
	listen         80;
	server_name    _;

	root /overleaf/services/web/public/;

	location /metrics {
		internal;
	}

	location / {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Accept-Encoding "";
		proxy_read_timeout 10m;
		proxy_send_timeout 10m;

		sub_filter_once on;
		sub_filter_types text/html;

		sub_filter '</head>' '
<style>
  .unesp-banner {
    background-color: #0095d9;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .unesp-banner img { height: 44px; }
</style>
</head>';

		sub_filter '<body>' '<body>
<div class="unesp-banner">
  <img src="/img/unesp-logo.png" alt="UNESP">
</div>';
	}

	location /socket.io {
		proxy_pass http://127.0.0.1:3026;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 10m;
		proxy_send_timeout 10m;
	}

	location /stylesheets {
		expires 1y;
	}

	location /minjs {
		expires 1y;
	}

	location /img {
		expires 1y;
	}

	location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/build/([0-9a-f-]+)/output/output\.([a-z.]+)$ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
	}

	location ~ ^/project/([0-9a-f]+)/build/([0-9a-f-]+)/output/output\.([a-z.]+)$ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
	}

	location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
	}

	location ~ ^/project/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
	}

	location ~* ^/metrics/?$ {
		return 404 'Not found';
	}

	location ~* ^/health_check {
		return 404 'Not found';
	}

	include /etc/nginx/vhost-extras/overleaf/*.conf;
}
